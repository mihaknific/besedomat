<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Besedomat — Preusmerjanje...</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #090d16;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --pink: #f43f5e;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --text: #0f172a;
        --text-dim: #64748b;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .redirect-card {
      max-width: 420px;
      padding: 32px 24px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(244, 63, 94, 0.2);
      border-top-color: var(--pink);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 18px; margin: 0 0 8px; font-weight: 600; }
    p { font-size: 14px; color: var(--text-dim); margin: 0 0 16px; line-height: 1.5; }
    a { color: var(--pink); text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
  </style>
  <script>
    (function() {
      // GitHub Pages SPA redirect: pretvori direktne URL poti v odjemalski hash routing za index.html
      var l = window.location;
      var path = l.pathname;
      var segments = path.split('/').filter(Boolean);

      // Če je gostovano v podmapi na GitHub Pages (npr. uporabnik.github.io/ime-repozitorija/...)
      var repo = '';
      if (l.hostname.endsWith('github.io') && segments.length > 0) {
        repo = '/' + segments.shift();
      }

      var route = segments.join('/');
      var targetHash = '';
      if (route) {
        if (
          !route.startsWith('orodje/') &&
          !route.startsWith('vsa-orodja') &&
          !route.startsWith('priljubljena') &&
          !route.startsWith('zasebnost') &&
          !route.startsWith('pogoji') &&
          !route.startsWith('o-nas')
        ) {
          targetHash = '#/orodje/' + route;
        } else {
          targetHash = '#/' + route;
        }
      } else if (l.hash) {
        targetHash = l.hash;
      }

      var targetUrl = l.origin + repo + '/' + (l.search || '') + targetHash;
      l.replace(targetUrl);
    })();
  </script>
</head>
<body>
  <div class="redirect-card">
    <div class="spinner"></div>
    <h1>Nalaganje orodja...</h1>
    <p>Preusmerjanje na ustrezno stran orodjarne Besedomat.</p>
    <p><a href="./">Kliknite tukaj, če preusmeritev ne deluje samodejno →</a></p>
  </div>
</body>
</html>
